name: Build Snowball Project
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - build

jobs:
  build_project:
    name: Build Project
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # -------------------------------
      # CACHE: Poetry + Virtualenvs
      # -------------------------------
      - name: Cache Poetry Virtualenvs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Python Dependencies
        run: |
          python --version
          python -m pip install --upgrade pip poetry

      - name: Check Project Configuration TOML
        run: |
          poetry --version
          poetry check --no-interaction --lock
          poetry env info

      - name: Install Poetry Dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with test --no-interaction

      - name: Execute Snowball Project PY Lint
        run: |
          source .venv/bin/activate
          poetry run ruff check .

      - name: Execute Snowball Project TOML Lint
        run: |
          source .venv/bin/activate
          poetry run toml-sort pyproject.toml

      - name: Execute Snowball Project Markdown Lint
        run: |
          source .venv/bin/activate
          poetry run pymarkdownlnt scan -r . -e ./.venv

      - name: Execute Snowball Project YAML Lint
        run: |
          source .venv/bin/activate
          poetry run yamllint --list-files .
          poetry run yamllint -s -f github .

      - name: Build Snowball Project
        run: poetry build --no-interaction

      # Upload build artifacts for test job
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snowball-dist
          path: dist/

  # -----------------------------------------
  # TEST JOB (runs after build)
  # -----------------------------------------
  test_project:
    name: Test Project
    runs-on: ubuntu-latest
    needs: build_project

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Restore Poetry cache + venv
      - name: Cache Poetry Virtualenvs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --with test --no-interaction

      - name: Execute Snowball Project Tests
        run: |
          source .venv/bin/activate
          poetry run pytest -vvx

      - name: Execute Snowball Project Coverage
        run: |
          source .venv/bin/activate
          poetry run pytest --cov=snowball --cov-branch
