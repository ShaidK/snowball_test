name: Build Snowball Project

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [build]

# -----------------------------------------
# YAML ANCHORS (shared steps)
# -----------------------------------------
defaults: {}

# Shared setup steps
setup_python_steps: &setup_python_steps
  - name: Checkout Snowball Project Repository
    uses: actions/checkout@v4

  - name: Configure Python Runtime Environment
    uses: actions/setup-python@v5
    with:
      python-version: 3.12
      cache: "pip"

  - name: Cache Poetry Virtualenvs
    uses: actions/cache@v4
    with:
      path: |
        ~/.cache/pypoetry
        .venv
      key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
      restore-keys: |
        poetry-${{ runner.os }}-3.12-

  - name: Install Python Dependencies
    run: |
      python -m pip install --upgrade pip poetry
      poetry config virtualenvs.in-project true
      poetry install --with test --no-interaction

# -----------------------------------------
# JOBS
# -----------------------------------------
jobs:
  build_project:
    runs-on: ubuntu-latest
    steps:
      <<: *setup_python_steps

      - name: Check Project Configuration TOML
        run: |
          poetry check --no-interaction --lock
          poetry env info

      - name: Build Snowball Project
        run: poetry build --no-interaction

  success_test:
    runs-on: ubuntu-latest
    needs: build_project
    steps:
      <<: *setup_python_steps

      - name: Execute Snowball Project Tests
        run: poetry run pytest -vvx

  failure_test:
    runs-on: ubuntu-latest
    needs: build_project
    steps:
      <<: *setup_python_steps

      - name: Execute Snowball Project Tests
        run: poetry run pytest -vvx

  coverage:
    runs-on: ubuntu-latest
    needs: [success_test, failure_test]
    steps:
      <<: *setup_python_steps

      - name: Execute Snowball Project Coverage
        run: poetry run pytest --cov=snowball --cov-branch
