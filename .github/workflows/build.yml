name: Build Snowball Project
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - build

jobs:
  build_project:
    name: Build Snowball Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"

      # -------------------------------
      # CACHE: Poetry + Virtualenvs
      # -------------------------------
      - name: Cache Poetry Virtualenvs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install Python Dependencies
        run: |
          python --version
          python -m pip install --upgrade pip poetry

      - name: Check Project Configuration TOML
        run: |
          poetry --version
          poetry check --no-interaction --lock
          poetry env info

      - name: Install Poetry Dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with test --no-interaction

      - name: Build Snowball Project
        run: poetry build --no-interaction

      # Upload build artifacts for test job
      #- name: Upload Build Artifacts
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: snowball-dist
      #    path: dist/

  # -----------------------------------------
  # TEST JOB (runs after build)
  # -----------------------------------------
  success_test:
    name: Run Snowball Successful Test
    runs-on: ubuntu-latest
    needs: build_project

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"

      # Restore Poetry cache + venv
      - name: Cache Poetry Virtualenvs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --with test --no-interaction

      - name: Execute Snowball Project Tests
        run: |
          source .venv/bin/activate
          poetry run pytest -vvx

  failure_test:
    name: Run Snowball Failure Test
    runs-on: ubuntu-latest
    needs: build_project

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"

      # Restore Poetry cache + venv
      - name: Cache Poetry Virtualenvs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --with test --no-interaction

      - name: Execute Snowball Project Tests
        run: |
          source .venv/bin/activate
          poetry run pytest -vvx

  coverage:
    name: Run Snowball Test Coverages
    runs-on: ubuntu-latest
    needs: [ success_test, failure_test ]

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Restore Poetry cache + venv
      - name: Cache Poetry Virtualenvs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --with test --no-interaction
  
      - name: Execute Snowball Project Coverage
        run: |
          source .venv/bin/activate
          poetry run pytest --cov=snowball --cov-branch
