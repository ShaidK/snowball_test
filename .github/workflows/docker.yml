name: Publish Docker
on:
  push:
    branches: [ "build" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish Docker
    runs-on: ubuntu-linux

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Snowball Project Repository
        uses: actions/checkout@v6

      - name: Docker Login
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_CONTAINER_TOKEN }}
          
